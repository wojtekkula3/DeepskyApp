name: Android CI

on:
  push:
    branches:
      - "**"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  detekt:
    name: Run Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      - name: Run Detekt
        run: ./gradlew --no-daemon --build-cache detekt
      - name: Upload Detekt Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/detekt-report.html

  ktlint:
    name: Run ktLint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      - name: Run Lint
        run: ./gradlew --no-daemon --build-cache ktlint
      - name: Upload Lint Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ktlint-report
          path: build/reports/ktlint/ktlint-report.html

  test:
    name: Run Unit Tests (Android host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      # `test` only reaches :androidApp, which holds no tests — every test in this project lives in a
      # KMP module and runs as `testAndroidHostTest`. This is the whole suite on the JVM; the iOS half
      # of the same common code is covered by the `ios-test` job below.
      - name: Run Tests
        run: ./gradlew --no-daemon --build-cache testAndroidHostTest
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unitTest-report
          path: |
            */build/reports/tests/testAndroidHostTest/
            */*/build/reports/tests/testAndroidHostTest/

  ios-test:
    name: Run Unit Tests (iOS simulator)
    runs-on: macos-latest
    # macOS runners are free for public repositories.
    # Keep iOS tests limited to long-lived branches to avoid unnecessary CI time.
    # Locally `./gradlew allTests` covers both platforms at once.
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/feature/kmp-migration'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      - name: Run Tests
        run: ./gradlew --no-daemon --build-cache iosSimulatorArm64Test
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iosUnitTest-report
          path: |
            */build/reports/tests/iosSimulatorArm64Test/
            */*/build/reports/tests/iosSimulatorArm64Test/

  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon --build-cache :androidApp:assembleDebug
