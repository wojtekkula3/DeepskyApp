name: Deploy to Google Play Closed Beta

on:
  workflow_dispatch: { }

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
#          cache: gradle
      - name: Create local.properties
        run: echo "APOD_API_KEY=${{ secrets.APOD_API_KEY }}" > local.properties

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Sign app AAB
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # The signing action writes a new file next to the unsigned one and only reports its name through
      # an output, so the upload copies it to a fixed name instead of guessing. Uploading the bundle at
      # its build path would ship the *unsigned* artifact, which Google Play rejects.
      - name: Stage signed AAB
        run: cp "${{ steps.sign.outputs.signedReleaseFile }}" deepsky-release.aab

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: deepsky-release.aab

  deploy:
    name: Deploy to Google Play Closed Beta
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: .
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.wojciechkula.deepskyapp
          releaseFiles: deepsky-release.aab
          track: internal
